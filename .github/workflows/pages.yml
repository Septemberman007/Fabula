# Sestaví Fabulu a vystaví ji na GitHub Pages při každém nahrání do větve main.
# Dokud je repozitář soukromý (Pages na něm nejsou dostupné), nasazení se přeskočí.
name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fabula/package-lock.json
      - run: npm ci
        working-directory: fabula
      - run: npm test
        working-directory: fabula
      - run: npm run build
        working-directory: fabula
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fabula/dist
      - id: deployment
        uses: actions/deploy-pages@v4
